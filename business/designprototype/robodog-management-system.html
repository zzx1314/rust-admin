<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四足机器人管理平台 · RoboDog OPS</title>
<style>
/* ============ 基础与设计令牌 ============ */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --line:#e6ebf2; --line-2:#f0f3f8;
  --text:#0f172a; --text-2:#475569; --muted:#94a3b8;
  --brand:#0284c7; --brand-2:#06b6d4; --brand-soft:#e3f4fd;
  --ok:#10b981; --warn:#f59e0b; --danger:#ef4444; --info:#3b82f6; --neutral:#94a3b8;
  --sidebar-a:#0a1424; --sidebar-b:#10233d;
  --shadow:0 1px 2px rgba(15,23,42,.03), 0 8px 26px rgba(15,23,42,.055);
  --shadow-lg:0 20px 60px rgba(15,23,42,.18);
  --r:14px; --r-sm:9px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ============ 布局骨架 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:238px;flex:none;position:sticky;top:0;height:100vh;z-index:30;
  background:linear-gradient(170deg,var(--sidebar-a),var(--sidebar-b));
  color:#b9c8dc;display:flex;flex-direction:column;transition:width .25s ease;
  border-right:1px solid rgba(255,255,255,.05);
}
.sidebar.collapsed{width:74px}
.sidebar.collapsed .hide-c{display:none}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-group-title,.sidebar.collapsed .sb-status{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:11px 0}
.sidebar.collapsed .brand{padding:0 0 0 0;justify-content:center}
.sidebar.collapsed .nav-item .ic{width:20px;height:20px}
.brand{height:70px;display:flex;align-items:center;gap:11px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.07);flex:none}
.brand-logo{
  width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,#0284c7,#22d3ee);color:#fff;box-shadow:0 6px 18px rgba(6,182,212,.35);
}
.brand-logo .ic{width:23px;height:23px}
.brand-text b{display:block;color:#fff;font-size:15px;letter-spacing:.5px;line-height:1.25}
.brand-text span{display:block;font-size:10.5px;color:#64809e;letter-spacing:1.6px;margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:16px 12px}
.nav-group-title{font-size:10.5px;letter-spacing:1.4px;color:#5c7797;padding:14px 12px 8px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;margin-bottom:3px;
  font-size:13.5px;font-weight:500;color:#a9bdd4;cursor:pointer;position:relative;transition:.18s;
  border:1px solid transparent;user-select:none;
}
.nav-item .ic{opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{
  background:linear-gradient(90deg,rgba(6,182,212,.20),rgba(6,182,212,.04));
  color:#fff;border-color:rgba(34,211,238,.18);
}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#22d3ee}
.nav-item.active .ic{opacity:1;color:#38dcf0}
.nav-badge{margin-left:auto;background:#ef4444;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.sidebar.collapsed .nav-badge{display:none}
.sb-status{
  margin:10px 12px 16px;padding:13px;border-radius:11px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.07);font-size:11.5px;color:#8ba6c2;
}
.sb-status .st-row{display:flex;align-items:center;gap:8px;color:#c8dcf0;font-weight:600;font-size:12px;margin-bottom:7px}
.breath{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:breath 2s infinite}
@keyframes breath{70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.sb-status p{margin:3px 0;line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:64px;flex:none;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;
  padding:0 26px;position:sticky;top:0;z-index:25;
}
.tb-toggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--text-2)}
.tb-toggle:hover{background:#f8fafc}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.crumb b{color:var(--text);font-weight:600}
.tb-spacer{flex:1}
.tb-search{position:relative;width:250px}
.tb-search .ic{position:absolute;left:11px;top:9px;color:var(--muted);width:15px;height:15px}
.input,.select{
  height:34px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;font-size:13px;
  color:var(--text);background:#fff;outline:none;transition:.15s;width:100%;
}
.input::placeholder{color:#a8b5c5}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(2,132,199,.11)}
.tb-search .input{padding-left:34px;background:#f7f9fc}
.tb-time{font-size:12px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.tb-icon{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text-2);
  display:grid;place-items:center;position:relative;
}
.tb-icon:hover{background:#f8fafc;color:var(--text)}
.tb-icon .red-dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#ef4444;border:1.5px solid #fff}
.tb-user{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--line);cursor:pointer}
.avatar{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#0369a1,#06b6d4);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.tb-user .u-name{font-size:12.5px;font-weight:600;line-height:1.2}
.tb-user .u-role{font-size:10.5px;color:var(--muted);line-height:1.4}
.content{padding:24px 26px 46px;flex:1;min-width:0}
.view{display:none}
.view.active{display:block}
.view.active>*{animation:fadeUp .38s ease both}
.view.active>*:nth-child(2){animation-delay:.05s}
.view.active>*:nth-child(3){animation-delay:.1s}
.view.active>*:nth-child(4){animation-delay:.15s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.head-actions{display:flex;align-items:center;gap:9px}
.live-chip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#0e7490;background:#e6f8fd;border:1px solid #b9e9f7;padding:6px 11px;border-radius:999px;font-weight:600}
.live-chip i{width:6px;height:6px;border-radius:50%;background:#06b6d4;animation:breath 2s infinite}
.btn{
  height:34px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--text-2);
  font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap;
}
.btn .ic{width:14px;height:14px}
.btn:hover{border-color:#c5d2e2;background:#f8fafc;color:var(--text)}
.btn.primary{background:linear-gradient(135deg,#0284c7,#06b6d4);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(2,132,199,.22)}
.btn.primary:hover{filter:brightness(1.07);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#f1f5f9}
.btn.sm{height:28px;padding:0 10px;font-size:11.5px;border-radius:7px}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.danger{color:#dc2626;border-color:#fecaca;background:#fff}
.btn.danger:hover{background:#fef2f2}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px}
.card-title .ic{color:var(--brand);width:16px;height:16px}
.card-sub{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:2px}
.card-body{padding:18px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.row-2{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.row-2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt18{margin-top:18px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{background:#e9fbf3;color:#059669}
.badge.info{background:#eaf2ff;color:#2563eb}
.badge.warn{background:#fff5e5;color:#d97706}
.badge.danger{background:#fdeced;color:#dc2626}
.badge.neutral{background:#f1f5f9;color:#64748b}
.badge.brand{background:var(--brand-soft);color:#0369a1}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:600;background:#f1f5f9;color:#64748b}
.tag.blue{background:#e8f3fd;color:#0369a1}
.tag.purple{background:#f1ecfe;color:#7c3aed}
.tag.teal{background:#e2f8f5;color:#0d9488}
.tag.orange{background:#fff2e3;color:#c2410c}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12px}
.divider{height:1px;background:var(--line-2);margin:14px 0}

/* KPI */
.kpi{padding:17px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--kpi-soft);opacity:.6}
.kpi-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--kpi-c);background:var(--kpi-soft)}
.kpi-icon .ic{width:19px;height:19px}
.trend{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.trend.up{background:#e9fbf3;color:#059669}
.trend.down{background:#fdeced;color:#dc2626}
.trend .ic{width:11px;height:11px}
.kpi-label{font-size:12px;color:var(--text-2);margin-top:14px;position:relative;z-index:1}
.kpi-value{font-size:27px;font-weight:750;letter-spacing:-.6px;margin-top:3px;line-height:1.2;position:relative;z-index:1}
.kpi-value small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi-foot{font-size:11px;color:var(--muted);margin-top:5px;position:relative;z-index:1}
.spark{position:absolute;right:14px;bottom:14px;width:74px;height:30px;opacity:.85;z-index:1}

/* 表格 */
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px}
.table th{
  text-align:left;padding:11px 16px;background:#f8fafc;color:#8b9aad;font-weight:600;font-size:11.5px;
  letter-spacing:.02em;white-space:nowrap;border-bottom:1px solid var(--line);
}
.table td{padding:12px 16px;border-bottom:1px solid var(--line-2);color:var(--text-2);vertical-align:middle;white-space:nowrap}
.table tbody tr{transition:background .15s;cursor:default}
.table tbody tr:hover{background:#f7fbff}
.table tbody tr:last-child td{border-bottom:none}
.cell-main{color:var(--text);font-weight:600;font-size:12.5px}
.cell-sub{font-size:11px;color:var(--muted);margin-top:2px}
.row-icon{width:32px;height:32px;border-radius:9px;background:#eef6fc;color:#0284c7;display:grid;place-items:center;flex:none}
.row-flex{display:flex;align-items:center;gap:10px}
.actions{display:flex;gap:5px}
.tfoot{padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.pager{display:flex;gap:5px}
.pager button{width:27px;height:27px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:11.5px;display:grid;place-items:center}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager button:hover:not(.on){background:#f1f5f9}

/* 进度 / 电量 */
.bar{height:6px;border-radius:6px;background:#eef2f7;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0284c7,#22d3ee);transition:width .6s ease}
.bar.ok>i{background:linear-gradient(90deg,#10b981,#34d399)}
.bar.warn>i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.danger>i{background:linear-gradient(90deg,#ef4444,#f87171)}
.bar-row{display:flex;align-items:center;gap:9px}
.bar-row .num{font-size:11.5px;font-weight:600;color:var(--text-2);width:32px;text-align:right;font-variant-numeric:tabular-nums}

/* 工具栏 / 筛选 */
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search{position:relative;width:230px}
.toolbar .search .ic{position:absolute;left:11px;top:9px;color:var(--muted);width:15px;height:15px}
.toolbar .search .input{padding-left:34px}
.toolbar .select{width:auto;min-width:130px}
.toolbar .sep{flex:1}
.seg{display:inline-flex;background:#eef2f7;padding:3px;border-radius:9px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;transition:.15s}
.seg button .ic{width:13px;height:13px}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(15,23,42,.1)}
.stat-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-tab{
  flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 15px;
  cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.stat-tab:hover{border-color:#b9d8ec;transform:translateY(-1px)}
.stat-tab.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(2,132,199,.12)}
.stat-tab.on::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.stat-tab .st-label{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-tab .st-label i{width:7px;height:7px;border-radius:50%}
.stat-tab .st-val{font-size:21px;font-weight:750;margin-top:6px;letter-spacing:-.4px}
.stat-tab .st-val small{font-size:11px;font-weight:500;color:var(--muted)}

/* 地图 */
.map-card .card-body{padding:0}
.map-stage{position:relative;background:#f7fafc;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.map-stage > svg{display:block;width:100%;height:auto}
.map-stage .ic{width:14px;height:14px}
.map-legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:9px;padding:9px 12px;display:flex;gap:14px;font-size:10.5px;color:var(--text-2);box-shadow:var(--shadow)}
.map-legend span{display:flex;align-items:center;gap:6px}
.map-legend i{width:9px;height:9px;border-radius:50%;display:block}
.map-badge{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.map-devices{display:flex;gap:9px;padding:13px 18px;border-top:1px solid var(--line-2);overflow-x:auto;flex-wrap:wrap}
.map-chip{display:flex;align-items:center;gap:8px;background:#f7fafc;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.map-chip:hover{border-color:var(--brand);background:#f0f9ff}
.map-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.15)}
.map-chip b{color:var(--text);font-size:11.5px}
@keyframes mapflow{to{stroke-dashoffset:-36}}
@keyframes radar{0%{transform:scale(.45);opacity:.55}100%{transform:scale(2.4);opacity:0}}
.radar{transform-box:fill-box;transform-origin:center;animation:radar 2.4s ease-out infinite}
.dog-2 .radar{animation-delay:.6s}.dog-3 .radar{animation-delay:1.2s}.dog-4 .radar{animation-delay:1.8s}

/* 环形图 */
.donut-wrap{display:flex;align-items:center;gap:22px;padding:6px 2px}
.donut{width:132px;height:132px;border-radius:50%;position:relative;flex:none;display:grid;place-items:center}
.donut::after{content:"";position:absolute;inset:20px;background:#fff;border-radius:50%}
.donut-center{position:relative;z-index:1;text-align:center}
.donut-center b{display:block;font-size:24px;line-height:1.1;letter-spacing:-.5px}
.donut-center span{font-size:10.5px;color:var(--muted)}
.legend{flex:1;display:grid;gap:11px}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-row i{width:9px;height:9px;border-radius:3px;flex:none}
.legend-row span{flex:1;color:var(--text-2)}
.legend-row b{color:var(--text);font-size:12.5px}

/* 告警列表 */
.alert-item{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.alert-item:last-child{border-bottom:none;padding-bottom:0}
.alert-item:first-child{padding-top:0}
.alert-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.alert-ico .ic{width:15px;height:15px}
.alert-ico.danger{background:#fdeced;color:#dc2626}
.alert-ico.warn{background:#fff5e5;color:#d97706}
.alert-ico.info{background:#eaf2ff;color:#2563eb}
.alert-txt{flex:1;min-width:0}
.alert-txt b{display:block;font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alert-txt span{font-size:10.5px;color:var(--muted);display:block;margin-top:3px}
.alert-time{font-size:10.5px;color:var(--muted);white-space:nowrap}

/* 趋势图 / 时间线 */
.chart-svg{width:100%;height:auto;display:block}
.timeline{padding:2px 0}
.tl-item{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:11px;top:22px;bottom:-2px;width:1px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:23px;height:23px;border-radius:50%;background:#eef6fc;border:1px solid #cfe8f8;display:grid;place-items:center;flex:none;z-index:1;color:var(--brand)}
.tl-dot .ic{width:12px;height:12px}
.tl-dot.ok{background:#e9fbf3;border-color:#bff0dc;color:#059669}
.tl-dot.warn{background:#fff5e5;border-color:#fde5b8;color:#d97706}
.tl-body b{font-size:12px;color:var(--text);font-weight:600}
.tl-body p{margin:3px 0 0;font-size:11px;color:var(--muted);line-height:1.5}
.tl-body time{font-size:10.5px;color:#b3c0cf}

/* 园区卡片 */
.park-card{overflow:hidden;transition:.2s}
.park-card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(15,23,42,.10);border-color:#c9dfef}
.park-thumb{height:118px;position:relative;overflow:hidden;background:#eaf3f1}
.park-thumb svg{width:100%;height:100%;display:block}
.park-thumb .thumb-tag{position:absolute;left:11px;top:11px;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);border-radius:7px;padding:4px 9px;font-size:10.5px;font-weight:600;color:var(--text-2)}
.park-body{padding:15px 16px}
.park-name{display:flex;align-items:center;justify-content:space-between;gap:8px}
.park-name b{font-size:14.5px;font-weight:700}
.park-meta{font-size:11px;color:var(--muted);margin-top:4px}
.park-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.park-stat{background:#f7f9fc;border-radius:8px;padding:9px 10px}
.park-stat b{display:block;font-size:15px;font-weight:700;color:var(--text)}
.park-stat span{font-size:10px;color:var(--muted)}
.park-prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.park-prog-label b{color:var(--text-2)}
.park-foot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;padding-top:12px;border-top:1px solid var(--line-2)}
.park-owner{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.park-owner .avatar{width:24px;height:24px;border-radius:8px;font-size:10px}

/* 任务看板 */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:#eef2f7;border-radius:12px;padding:11px;min-height:220px;transition:background .15s}
.kcol.dragover{background:#dbeefe;outline:2px dashed var(--brand);outline-offset:-3px}
.kcol-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 11px}
.kcol-head b{font-size:12.5px;display:flex;align-items:center;gap:7px}
.kcol-head b i{width:8px;height:8px;border-radius:50%}
.kcol-count{background:#fff;border-radius:7px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--text-2)}
.task-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.05);cursor:grab;transition:.16s}
.task-card:hover{box-shadow:0 6px 16px rgba(15,23,42,.09);transform:translateY(-1px)}
.task-card:active{cursor:grabbing}
.task-card.dragging{opacity:.4}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.tc-name{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.4}
.tc-info{display:grid;gap:5px;font-size:11px;color:var(--muted);margin:10px 0}
.tc-info span{display:flex;align-items:center;gap:6px}
.tc-info .ic{width:12px;height:12px;color:#a3b2c4}
.tc-prog{display:flex;align-items:center;gap:8px;margin-top:10px}
.tc-prog .bar{flex:1}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:11px;padding-top:10px;border-top:1px solid var(--line-2)}
.tc-foot .time{font-size:10.5px;color:var(--muted)}

/* 设置页 */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.setting-row:last-child{border-bottom:none}
.setting-row b{font-size:12.5px;font-weight:600;display:block}
.setting-row p{font-size:11px;color:var(--muted);margin:4px 0 0;line-height:1.5}
.switch{width:38px;height:21px;border-radius:12px;background:#cbd5e1;position:relative;flex:none;cursor:pointer;transition:.2s;border:0;padding:0}
.switch.on{background:var(--brand)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on::after{left:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field label em{color:var(--danger);font-style:normal}
.field .input,.field .select,.field .textarea{width:100%}
.textarea{height:76px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;resize:vertical;outline:none;color:var(--text)}

/* 模态 / 抽屉 / Toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,100%);background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:popIn .22s ease;max-height:90vh;display:flex;flex-direction:column}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head b{font-size:15px}
.modal-head p{font-size:11.5px;color:var(--muted);margin:4px 0 0}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:#fbfcfe}
.drawer-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:60;animation:fadeIn .18s ease}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;z-index:61;box-shadow:-16px 0 50px rgba(15,23,42,.18);display:flex;flex-direction:column;animation:slideIn .26s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex:none}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fbfcfe}
.video-box{height:180px;border-radius:11px;background:radial-gradient(circle at 50% 40%,#1b3247,#0a1420);position:relative;overflow:hidden;display:grid;place-items:center;color:#7d9ab4}
.video-box::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.video-box .cam{position:relative;text-align:center;z-index:1}
.video-box .cam .ic{width:34px;height:34px;opacity:.5}
.video-box .cam p{font-size:11px;margin:8px 0 0;letter-spacing:.5px}
.live-tag{position:absolute;left:12px;top:12px;background:rgba(239,68,68,.9);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:5px;z-index:2}
.live-tag i{width:5px;height:5px;border-radius:50%;background:#fff;animation:breath 1.6s infinite}
.cam-ts{position:absolute;right:12px;bottom:11px;font-size:10px;color:#8fb0c9;z-index:2}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.metric{background:#f7f9fc;border:1px solid var(--line-2);border-radius:10px;padding:11px 12px}
.metric span{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:5px}
.metric b{font-size:16px;display:block;margin-top:5px;letter-spacing:-.3px}
.metric b small{font-size:10.5px;color:var(--muted);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{font-weight:600;color:var(--text-2);text-align:right}
.toast-stack{position:fixed;right:22px;top:78px;z-index:90;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:10px;padding:11px 15px;box-shadow:0 10px 30px rgba(15,23,42,.14);font-size:12.5px;font-weight:600;color:var(--text);min-width:210px;animation:toastIn .25s ease}
.toast.err{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--info)}
.toast .ic{width:15px;height:15px;color:var(--ok)}
.toast.err .ic{color:var(--danger)}
.toast.info .ic{color:var(--info)}
@keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.popover{position:absolute;right:0;top:44px;width:310px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:40;overflow:hidden}
.popover-head{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.popover-foot{padding:10px;text-align:center;border-top:1px solid var(--line-2)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:12.5px}
.empty .ic{width:28px;height:28px;display:block;margin:0 auto 10px;opacity:.5}

/* ============ 巡检路线规划模块 ============ */
.route-layout{display:grid;grid-template-columns:246px minmax(0,1fr) 332px;gap:16px;align-items:start}
.rp{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rp-head{padding:13px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.rp-head b{font-size:12.5px;display:flex;align-items:center;gap:7px}
.rp-head .ic{width:15px;height:15px;color:var(--brand)}
.rp-body{padding:13px}
.rt-search{position:relative;margin-bottom:11px}
.rt-search .ic{position:absolute;left:10px;top:9px;color:var(--muted);width:14px;height:14px}
.rt-search .input{padding-left:31px;height:32px;font-size:12px}
.rt-item{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:.16s;position:relative}
.rt-item:hover{border-color:#bcd9ed;background:#f9fcff}
.rt-item.on{border-color:var(--brand);background:#f0f9ff;box-shadow:0 0 0 2px rgba(2,132,199,.1)}
.rt-item.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.rt-item b{font-size:12.5px;display:block;line-height:1.35}
.rt-item .rt-sub{font-size:10.5px;color:var(--muted);margin-top:4px}
.rt-item .rt-meta{display:flex;gap:10px;margin-top:9px;font-size:10.5px;color:var(--text-2)}
.rt-item .rt-meta span{display:flex;align-items:center;gap:4px}
.rt-item .rt-meta .ic{width:12px;height:12px;color:var(--muted)}
.rt-new{width:100%;border:1px dashed #b9d4e8;background:#f7fcff;color:var(--brand);border-radius:9px;height:34px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.rt-new:hover{background:#eaf6ff}
.rt-toolbar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.rt-tool{height:29px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.rt-tool .ic{width:13px;height:13px}
.rt-tool:hover{background:#f5f9fd;border-color:#cbd5e1}
.rt-tool.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rt-tool.on .ic{color:#fff}
.rt-tool.danger:hover{color:#dc2626;border-color:#fecaca;background:#fef2f2}
.rt-tool-sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.rt-toolbar .sep{flex:1}
.rt-canvas{position:relative;background:#f7fafc;overflow:hidden}
.rt-canvas > svg{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.rt-canvas > svg.select-mode{cursor:default}
.wp-hit{cursor:grab}
.wp-hit:active{cursor:grabbing}
.leg-hit{cursor:pointer;stroke:transparent;stroke-width:20;fill:none}
.leg-hit:hover{stroke:rgba(2,132,199,.09)}
.rt-canvas-tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:10.5px;color:var(--text-2);box-shadow:var(--shadow)}
.rt-legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:8px;padding:8px 11px;display:grid;gap:5px;font-size:10.5px;color:var(--text-2)}
.rt-legend span{display:flex;align-items:center;gap:6px}
.rt-legend i{width:9px;height:9px;border-radius:50%}
.rt-metrics{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line-2);background:#fbfcfe}
.rt-metric{padding:11px 14px;border-right:1px solid var(--line-2)}
.rt-metric:last-child{border-right:none}
.rt-metric span{font-size:10.5px;color:var(--muted)}
.rt-metric b{display:block;font-size:16px;margin-top:3px;letter-spacing:-.3px}
.rt-metric b small{font-size:10px;color:var(--muted);font-weight:500}
.rt-timeline{display:flex;overflow-x:auto;padding:14px 16px 16px}
.rt-step{flex:1;min-width:112px;position:relative;padding-right:12px}
.rt-step::after{content:"";position:absolute;right:2px;top:11px;width:14px;height:1.5px;background:#cbd5e1}
.rt-step:last-child::after{display:none}
.rt-step .dot{width:22px;height:22px;border-radius:50%;background:#e8f3fb;color:var(--brand);display:grid;place-items:center;font-size:10px;font-weight:700;border:1px solid #c7e4f6}
.rt-step.active .dot{background:var(--brand);color:#fff;border-color:var(--brand)}
.rt-step b{display:block;font-size:11px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-step span{font-size:10px;color:var(--muted);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-tabs{display:flex;gap:3px;padding:9px 12px 0;border-bottom:1px solid var(--line-2)}
.rt-tab{flex:1;height:32px;border:0;background:transparent;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.rt-tab .ic{width:13px;height:13px}
.rt-tab.on{color:var(--brand);border-bottom-color:var(--brand);background:#f5fbff}
.rt-prop{padding:14px;max-height:620px;overflow-y:auto}
.rt-field{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rt-field label{width:74px;flex:none;font-size:11.5px;color:var(--text-2);font-weight:600}
.rt-field .input,.rt-field .select{height:31px;font-size:12px;flex:1;min-width:0;padding:0 9px}
.rt-field .chk{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);cursor:pointer}
.rt-sec-title{font-size:11.5px;font-weight:700;color:var(--text);margin:16px 0 10px;padding-top:13px;border-top:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between}
.rt-sec-title:first-child{margin-top:0;padding-top:0;border-top:none}
.rt-sec-title .ic{width:14px;height:14px;color:var(--brand)}
.act-card{border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;background:#fcfdff}
.act-card:hover{border-color:#c9dfef}
.act-top{display:flex;align-items:center;gap:8px}
.act-ico{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;flex:none;background:#e8f3fd;color:#0284c7}
.act-ico .ic{width:14px;height:14px}
.act-ico.purple{background:#f1ecfe;color:#7c3aed}
.act-ico.teal{background:#e2f8f5;color:#0d9488}
.act-ico.orange{background:#fff2e3;color:#c2410c}
.act-ico.gray{background:#f1f5f9;color:#64748b}
.act-top b{font-size:11.5px;flex:1}
.act-kv{display:grid;gap:3px;margin-top:8px;font-size:10.5px;color:var(--muted)}
.act-kv b{color:var(--text-2);font-weight:600}
.act-add{width:100%;height:32px;border:1px dashed #b9d4e8;background:#f8fcff;color:var(--brand);border-radius:9px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.rt-hint{background:#f0f9ff;border:1px solid #d5ebfa;border-radius:9px;padding:10px 11px;font-size:10.5px;color:#0c6f9c;line-height:1.65;margin-top:12px}
.sim-dog{filter:drop-shadow(0 2px 5px rgba(2,132,199,.45))}
.rt-val-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:11.5px}
.rt-val-item .ic{width:14px;height:14px}

/* 地图基线 */
.map-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.map-chip .ic{width:12px;height:12px}
.map-chip.ok{background:#e8f3fd;color:#0369a1;border-color:#cfe4f5}
.map-chip.warn{background:#fff2e3;color:#c2410c;border-color:#fbd8b4}
.map-chip.gray{background:#f1f5f9;color:#64748b;border-color:#e2e8f0}
.map-chip.none{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.map-policy-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px;background:#eef7fd;border:1px solid #cfe4f5;border-radius:var(--r);font-size:12px;color:var(--text-2)}
.map-policy-bar b{color:var(--text)}
.map-policy-bar .mp-txt{flex:1;min-width:220px;line-height:1.6}
.park-mapline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px;padding-top:10px;border-top:1px dashed var(--line)}
.policy-flow{display:grid;gap:12px}
.policy-step{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.policy-n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.policy-step b{font-size:12.5px;color:var(--text)}
.policy-step p{margin:5px 0 0;font-size:11.5px;line-height:1.65;color:var(--text-2)}
.map-baseline .kv{margin-top:7px}

/* 响应式 */
@media(max-width:1400px){.route-layout{grid-template-columns:220px minmax(0,1fr) 300px}}
@media(max-width:1180px){.route-layout{grid-template-columns:220px minmax(0,1fr)}.rt-prop-panel{grid-column:1/-1}.rt-metrics{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1280px){.kpis{grid-template-columns:repeat(2,1fr)}.row-2,.row-2b{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.route-layout{grid-template-columns:1fr}.rt-prop-panel{grid-column:auto}.sidebar{width:74px}.sidebar .hide-c,.sidebar .brand-text,.sidebar .nav-group-title,.sidebar .sb-status{display:none}.sidebar .nav-item{justify-content:center;padding:11px 0}.sidebar .brand{justify-content:center;padding:0}.tb-search{display:none}.tb-time{display:none}.content{padding:18px 16px 36px}.topbar{padding:0 16px}}
@media(max-width:640px){.kpis,.g3,.kanban,.form-grid{grid-template-columns:1fr}.page-title{font-size:18px}.toolbar .search{width:100%}.tb-user .u-name,.tb-user .u-role{display:none}.metric-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- ============ 图标库 ============ -->
<svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

/* ---------------- 通用小组件 ---------------- */
const statusTone = s => ({
  '运行中':'ok','正常':'ok','在线待命':'ok','已完成':'ok','已处理':'ok','执行任务':'info','执行中':'info',
  '充电中':'warn','处理中':'warn','部分维护':'warn','警告':'warn','维护中':'warn','重要':'warn',
  '异常':'danger','故障':'danger','未处理':'danger','严重':'danger','告警':'danger',
  '待执行':'neutral','离线':'neutral','提示':'neutral','常规':'neutral'
}[s] || 'neutral');
const badge = s => `<span class="badge ${statusTone(s)}"><i></i>${esc(s)}</span>`;
const tagTone = t => ({'定时巡检':'blue','应急处置':'orange','定点拍照':'purple','夜巡任务':'purple','设备维护':'orange','地图采集':'teal'}[t] || '');
const bar = (v, tone='') => {
  const t = tone || (v >= 80 ? 'ok' : v >= 40 ? '' : v >= 20 ? 'warn' : 'danger');
  return `<div class="bar-row"><div class="bar ${t}"><i style="width:${v}%"></i></div><span class="num">${v}%</span></div>`;
};
function sparkline(data, color){
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v,i)=>`${(i*(70/(data.length-1))+2).toFixed(1)},${(26-((v-min)/((max-min)||1))*20).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 74 30"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="72" cy="${(26-((data.at(-1)-min)/((max-min)||1))*20).toFixed(1)}" r="2.6" fill="${color}"/></svg>`;
}
const pageHead = (title, sub, actions='') => `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-sub">${sub}</div></div><div class="head-actions">${actions}</div></div>`;
const cardHead = (title, sub='', right='') => `<div class="card-head"><div class="card-title">${title}${sub?`<span class="card-sub">${sub}</span>`:''}</div>${right}</div>`;
const emptyRow = (txt) => `<tr><td colspan="12"><div class="empty">${ic('search')}${txt}</div></td></tr>`;

/* =========================================================
   视图：巡检路线规划
   Route → Waypoint（点动作） / Leg（段动作） → Action
   ========================================================= */
const curRoute = () => S.routes.find(r=>r.id===routeState.id) || S.routes[0];
let routeState = S.routeState;

function routeMetrics(r){
  let px = 0;
  for(let i=0;i<r.points.length-1;i++) px += Math.hypot(r.points[i+1].x-r.points[i].x, r.points[i+1].y-r.points[i].y);
  if(r.loop==='闭环' && r.points.length>2){
    const a=r.points[0], b=r.points[r.points.length-1];
    px += Math.hypot(a.x-b.x, a.y-b.y);
  }
  const meters = px*1.2;
  const dwell = r.points.reduce((s,p)=>s+Number(p.dwell||0),0);
  const acts = r.points.reduce((s,p)=>s+p.actions.length,0)
             + r.legs.reduce((s,l)=>s+l.actions.length,0)
             + (r.returnLeg ? r.returnLeg.actions.length : 0);
  const moveSec = meters/Number(r.speed||1.2);
  return {
    km:(meters/1000).toFixed(2), mins:Math.ceil((moveSec+dwell+acts*3)/60),
    acts, points:r.points.length, batt:Math.min(100,Math.round(meters/1000*8+acts*0.4))
  };
}
const legAt = i => {
  const r=curRoute();
  if(i<r.legs.length) return r.legs[i];
  return r.returnLeg || null;
};

/* 路径图层：航段（含点击热区）+ 航点 + 模拟机器狗 */
function routeLayer(r){
  const pts=r.points;
  const selLeg = routeState.selType==='leg' ? routeState.selIdx : -1;
  const selPt  = routeState.selType==='point' ? routeState.selIdx : -1;
  let out='';
  // 正向航段
  for(let i=0;i<r.legs.length;i++){
    const a=pts[i], b=pts[i+1]; if(!a||!b) continue;
    const on=selLeg===i, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on?'#f59e0b':'#0284c7'}" stroke-width="${on?5:3}" stroke-dasharray="9 7" marker-end="url(#rtarrow)" opacity="${on?1:.85}" style="animation:mapflow 1.4s linear infinite"/>`;
    out += `<line class="leg-hit" data-idx="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    out += `<g data-leg="${i}" style="cursor:pointer"><rect x="${mx-20}" y="${my-25}" width="40" height="16" rx="5" fill="${on?'#f59e0b':'#fff'}" stroke="${on?'#f59e0b':'#cfe3f2'}"/><text x="${mx}" y="${my-14}" font-size="9.5" fill="${on?'#fff':'#0369a1'}" text-anchor="middle" font-weight="700">${r.legs[i].actions.length} 项</text></g>`;
  }
  // 闭环返航段
  if(r.loop==='闭环' && r.returnLeg && pts.length>2){
    const a=pts[pts.length-1], b=pts[0], idx=r.legs.length;
    const on=selLeg===idx, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    out += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${on?'#f59e0b':'#94a3b8'}" stroke-width="2.4" stroke-dasharray="4 7" opacity=".85"/>`;
    out += `<line class="leg-hit" data-idx="${idx}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
    out += `<g data-leg="${idx}" style="cursor:pointer"><rect x="${mx-18}" y="${my-10}" width="36" height="16" rx="5" fill="#fff" stroke="#cbd5e1"/><text x="${mx}" y="${my+1}" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="700">返航</text></g>`;
  }
  // 航点
  pts.forEach((p,i)=>{
    const isStart=i===0, isEnd=i===pts.length-1, on=selPt===i;
    const fill = isStart?'#0d9488' : isEnd?'#0f172a' : '#0284c7';
    out += `<g class="wp-hit" data-idx="${i}">
      ${on?`<circle cx="${p.x}" cy="${p.y}" r="21" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3"/>`:''}
      <circle cx="${p.x}" cy="${p.y}" r="14" fill="#fff" stroke="${fill}" stroke-width="2.5"/>
      <circle cx="${p.x}" cy="${p.y}" r="7" fill="${fill}"/>
      <text x="${p.x}" y="${p.y+3.5}" font-size="9" fill="#fff" text-anchor="middle" font-weight="700">${i+1}</text>
      <g transform="translate(${p.x-46},${i%2?p.y-38:p.y+18})"><rect width="92" height="18" rx="5" fill="#fff" stroke="${on?'#f59e0b':'#e2e8f0'}"/><text x="46" y="12.5" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="600">${esc(p.name.length>9?p.name.slice(0,9)+'…':p.name)}</text></g>
    </g>`;
  });
  if(!pts.length) out += `<text x="400" y="230" font-size="14" fill="#94a3b8" text-anchor="middle">点击画布添加第一个航点</text>`;
  return out;
}

  const layer=$('#routeLayer'); if(layer) layer.innerHTML=routeLayer(r);
  const svg=$('#routeSvg'); if(svg) svg.classList.toggle('select-mode',routeState.mode==='select');
  const met=$('#rtMetrics');
  if(met){ const m=routeMetrics(r); met.innerHTML=`
    <div class="rt-metric"><span>航点数量</span><b>${m.points} <small>个</small></b></div>
    <div class="rt-metric"><span>预计里程</span><b>${m.km} <small>km</small></b></div>
    <div class="rt-metric"><span>预计耗时</span><b>${m.mins} <small>min</small></b></div>
    <div class="rt-metric"><span>动作总数</span><b>${m.acts} <small>项</small></b></div>
    <div class="rt-metric"><span>预估耗电</span><b>${m.batt} <small>%</small></b></div>`; }
  const tl=$('#rtTimeline'); if(tl) tl.innerHTML=routeTimelineHtml();
}
function svgXY(e,svg){
  const b=svg.getBoundingClientRect();
  return { x:Math.max(24,Math.min(776,(e.clientX-b.left)/b.width*800)), y:Math.max(22,Math.min(438,(e.clientY-b.top)/b.height*460)) };
}
function snapXY(p){
  if(!routeState.snap) return {x:Math.round(p.x/5)*5,y:Math.round(p.y/5)*5};
  let {x,y}=p;
  if(Math.abs(y-210)<30) y=210;
  if(Math.abs(x-430)<26) x=430;
  return {x:Math.round(x/5)*5,y:Math.round(y/5)*5};
}
function selectPoint(i){ routeState.selType='point'; routeState.selIdx=i; routeState.tab='point'; renderRoutes(); }
function selectLeg(i){ routeState.selType='leg'; routeState.selIdx=i; routeState.tab='leg'; renderRoutes(); }
function bindRouteCanvas(){
  const svg=$('#routeSvg'); if(!svg) return;
  let drag=null, moved=false, justDragged=false;
  svg.addEventListener('pointerdown', e=>{
    const wp=e.target.closest('.wp-hit');
    if(!wp) return;
    drag=Number(wp.dataset.idx); moved=false; saveHist();
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove', e=>{
    if(drag===null) return;
    const p=snapXY(svgXY(e,svg)), r=curRoute();
    r.points[drag].x=p.x; r.points[drag].y=p.y; moved=true;
    redrawCanvas();
  });
  svg.addEventListener('pointerup', e=>{
    if(drag===null) return;
    const idx=drag, wasMoved=moved; drag=null;
    if(!wasMoved){ routeState.hist.pop(); routeState.selType='point'; routeState.selIdx=idx; routeState.tab='point'; renderRoutes(); }
    else { justDragged=true; redrawCanvas(); renderRoutePropsOnly(); }
    moved=false;
  });
  svg.addEventListener('click', e=>{
    if(justDragged){ justDragged=false; return; }
    const wp=e.target.closest('.wp-hit'); if(wp){ selectPoint(Number(wp.dataset.idx)); return; }
    const hit=e.target.closest('.leg-hit'); if(hit){ selectLeg(Number(hit.dataset.idx)); return; }
    const lbl=e.target.closest('[data-leg]'); if(lbl){ selectLeg(Number(lbl.dataset.leg)); return; }
    if(routeState.mode==='add'){
      saveHist();
      const p=snapXY(svgXY(e,svg)), r=curRoute(), n=r.points.length;
      r.points.push({ name:'新航点 '+(n+1), x:p.x, y:p.y, dwell:5, radius:0.4, must:false, heading:0, onFail:'跳过继续',
        actions:[{type:'可见光拍照',param:ACTION_LIB['可见光拍照'].param,trigger:'到达即执行',threshold:'—',retry:1}] });
      r.legs.push({ mode:'沿道路', speed:r.speed, avoid:'标准', actions:[{type:'全程录像',param:'1080P / 25fps / 连续'}] });
      routeState.selType='point'; routeState.selIdx=n; routeState.tab='point';
      renderRoutes(); toast(`已添加航点 P${n+1}，并自动生成行进航段`);
    }
  });
}
function renderRoutePropsOnly(){
  const box=$('#rtProp'); if(!box) return;
  const showLeg=routeState.tab==='leg'||routeState.selType==='leg';
  box.innerHTML=showLeg?legProps():pointProps();
  $$('.rt-tab').forEach(t=>t.classList.toggle('on',(t.dataset.v==='leg')===showLeg));
}

/* 结构性操作 */
function undoRoute(){
  const snap=routeState.hist.pop();
  if(!snap){ toast('没有可撤销的操作','info'); return; }
  Object.assign(curRoute(),JSON.parse(snap));
  renderRoutes(); toast('已撤销上一步操作');
}
function deleteWaypoint(){
  const r=curRoute();
  if(routeState.selType!=='point'){ toast('请先点选一个航点','error'); return; }
  if(r.points.length<=2){ toast('至少需保留 2 个航点','error'); return; }
  saveHist();
  const i=routeState.selIdx;
  r.points.splice(i,1);
  r.legs.splice(Math.max(0,Math.min(i,r.legs.length-1)),1);
  if(r.legs.length>r.points.length-1) r.legs.length=r.points.length-1;
  routeState.selIdx=Math.max(0,i-1); routeState.selType='point';
  renderRoutes(); toast('航点及关联航段已删除');
}
function optimizeRoute(){
  const r=curRoute();
  if(r.points.length<3){ toast('航点不足 3 个，无需优化','info'); return; }
  saveHist();
  const rest=r.points.slice(1), order=[r.points[0]]; let cur=r.points[0];
  while(rest.length){
    let bi=0,bd=Infinity;
    rest.forEach((p,i)=>{ const d=Math.hypot(p.x-cur.x,p.y-cur.y); if(d<bd){bd=d;bi=i;} });
    cur=rest.splice(bi,1)[0]; order.push(cur);
  }
  r.points=order; renderRoutes(); toast('已按最近邻算法重排航点，缩短总里程');
}
function validateRoute(){
  const r=curRoute(), m=routeMetrics(r);
  const noAct=r.points.filter(p=>!p.actions.length).length;
  const noLegAct=r.legs.filter(l=>!l.actions.length).length;
  const items=[
    { ok:r.points.length>=2, t:`航点数量 ${r.points.length} 个`, d:r.points.length>=2?'满足最小巡检路径要求':'至少需要 2 个航点' },
    { ok:noAct===0, t:`航点动作覆盖`, d:noAct?`${noAct} 个航点未配置任何动作`:'全部航点均已配置采集动作' },
    { ok:true, t:`行进航段 ${legCount()} 段`, d:noLegAct?`${noLegAct} 段为静默通行（已确认）`:'所有航段均配置了持续任务' },
    { ok:!!r.points.find(p=>p.must), t:'必经点设置', d:r.points.find(p=>p.must)?'已设置必经点，不可跳过':'建议至少设置 1 个必经点' },
    { ok:m.batt<60, t:'续航可行性', d:`预估耗电 ${m.batt}%，${m.batt<60?'在当前机型续航范围内':'建议拆分路线或插入回充点'}` },
    { ok:r.loop==='闭环'?!!r.returnLeg:true, t:'闭环返航配置', d:r.loop==='闭环'?(r.returnLeg?'已配置返航段任务':'缺少返航段配置'):'往返路线，无需返航段' },
    { ok:true, t:'禁行区冲突检测', d:'路径未穿越园区禁行区' }
  ];
  const pass=items.filter(x=>x.ok).length;
  openModal('路线校验结果',`${r.id} · ${r.name} · ${pass}/${items.length} 项通过`,
    `<div class="rt-val-item" style="border:0;padding-bottom:12px">${ic('info')}<span class="muted">预计里程 ${m.km} km · 预计耗时 ${m.mins} min · 动作 ${m.acts} 项 · 预估耗电 ${m.batt}%</span></div>
     ${items.map(x=>`<div class="rt-val-item">${ic(x.ok?'check-circle':'warn')}<span style="flex:1;color:${x.ok?'#059669':'#d97706'}">${x.t}</span><span class="muted" style="text-align:right">${x.d}</span></div>`).join('')}
     <div class="rt-hint">校验通过后即可发布为正式版本；已发布的路线模板可被「任务管理」引用，下发时会自动展开为航点序列与动作指令集。</div>`,()=>{});
  $('#modalSubmit').hidden=true;
}
function publishRoute(){
  const r=curRoute();
  if(r.status==='已发布'){ toast(`${r.id} 已是已发布状态`,'info'); return; }
  if(r.points.length<2){ toast('航点不足，无法发布','error'); return; }
  const nums=(r.version.match(/\d+/g)||['1','0']).map(Number);
  let major=nums[0]||0, minor=(nums[1]||0)+1;
  if(minor>9){ major+=1; minor=0; }
  r.version='v'+major+'.'+minor;
  r.status='已发布'; r.updated='11-09 09:47';
  renderRoutes(); toast(`${r.id} 已发布为 ${r.version}，可被任务引用`);
}
function simulateRoute(){
  if(routeState.sim){ stopSim(); toast('已停止模拟','info'); return; }
  const r=curRoute();
  if(r.points.length<2){ toast('至少需要 2 个航点才能模拟','error'); return; }
  stopSim(); routeState.sim=true; routeState.timers=[];
  const btn=$('[data-act="rt-sim"]');
  if(btn){ btn.classList.add('on'); btn.innerHTML=ic('pause')+'停止模拟'; }
  const dog=$('#simDog'); if(dog) dog.hidden=false;
  let i=0;
  const run=()=>{
    if(!routeState.sim) return;
    if(i>=r.points.length){
      toast(`${r.id} 模拟执行完成，共 ${r.points.length} 个航点`,'success'); stopSim(); return;
    }
    const p=r.points[i];
    $$('.rt-step').forEach((s,k)=>s.classList.toggle('active',k===i));
    toast(`P${i+1} ${p.name} · 执行 ${p.actions.length} 项动作`,'info');
    const to=r.points[i+1] || (r.loop==='闭环'?r.points[0]:null);
    if(!to){ toast('路线执行完毕','success'); stopSim(); return; }
    const from=p, t0=performance.now(), dur=1100;
    const frame=t=>{
      if(!routeState.sim) return;
      const k=Math.min(1,(t-t0)/dur);
      const d=$('#simDog');
      if(d) d.setAttribute('transform',`translate(${(from.x+(to.x-from.x)*k).toFixed(1)},${(from.y+(to.y-from.y)*k).toFixed(1)})`);
      if(k<1) routeState.raf=requestAnimationFrame(frame);
      else { i++; routeState.timers.push(setTimeout(run,420)); }
    };
    routeState.raf=requestAnimationFrame(frame);
  };
  run();
}

/* ---------------- 园区 ↔ 地图基线 ----------------
   设计约定：园区建档时绑定「坐标系定义」；地图每次重标定生成不可变版本；
   路线创建时冻结一个 mapVersion 引用，之后不随园区当前地图变化。            */
function activeMap(parkName){
  return S.maps.find(m=>m.park===parkName && (m.status==='已发布'||m.status==='部分标定'));
}
function routeMap(r){
  if(!r) return null;
  if(r.map) return S.maps.find(m=>m.id===r.map) || null;  /* 显式引用：绝不随园区当前基线变化 */
  return activeMap(r.park);                              /* 仅兼容未声明版本的遗留数据 */
}
function mapRefs(mapId){
  const routes = S.routes.filter(r=>{ const m=routeMap(r); return m && m.id===mapId; });
  const tasks  = S.tasks.filter(t=>routes.some(r=>r.id===t.route));
  return { routes, tasks };
}
function mapChip(m){
  if(!m) return `<span class="map-chip none">${ic('warn')}未绑定 · 仅台账</span>`;
  const tone = m.status==='已发布' ? 'ok' : m.status==='部分标定' ? 'warn' : 'gray';
  return `<span class="map-chip ${tone}">${ic('layers')}${esc(m.id)} · ${esc(m.status)}</span>`;
}
function mapPolicyHtml(){
  return `<div class="policy-flow">
    <div class="policy-step"><span class="policy-n">1</span><div><b>园区建档时 · 首次绑定（必需）</b><p>绑定坐标系定义：frame_id、原点、分辨率、CRS、楼层、道路与禁行区。此时园区从「资产台账」变成「可规划空间」。未绑定 → 状态为「仅台账」，禁用一切路线与巡检任务入口。</p></div></div>
    <div class="policy-step"><span class="policy-n">2</span><div><b>地图标定后 · 发布不可变版本</b><p>每次建图／重标定产生新 mapVersion，旧版本不删除、不覆盖。园区只持有一个「当前生效基线」指针，供新建路线使用。</p></div></div>
    <div class="policy-step"><span class="policy-n">3</span><div><b>创建路线时 · 冻结版本引用（不再绑定）</b><p>路线落库写入 mapVersionId + frame_id + 坐标单位，之后引用冻结。地图发新版不会自动迁移历史路线，必须走影响分析 → 人工确认 → 灰度 → 旧版保留至引用清零。</p></div></div>
    <div class="policy-step"><span class="policy-n">4</span><div><b>任务下发时 · 校验一致性</b><p>下发包携带路线 + mapVersion + 地图 hash。设备执行前校验自身 SLAM 地图 hash，不一致则拒绝执行并告警，避免「拿 A 版地图跑 B 版路线」。</p></div></div>
  </div><div class="rt-hint" style="margin-top:12px">为什么不能后绑：航点坐标脱离坐标系只是一串无意义数字；补绑时已无法获知旧坐标的原点与比例尺，坐标迁移不可逆。多楼层、禁行区冲突、续航估算也全部依赖这一层。</div>`;

/* ---------------- 任务看板拖拽 ---------------- */
function bindDrag(){
  let dragId = null;
  $$('#kanban .task-card').forEach(card=>{
    card.addEventListener('dragstart', e=>{ dragId = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
  });
  $$('#kanban .kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      if(!dragId) return;
      const t = S.tasks.find(x=>x.id===dragId);
      const to = col.dataset.status;
      if(t && t.status!==to){
        t.status = to;
        if(to==='已完成') t.progress = 100;
        if(to==='待执行') t.progress = 0;
        renderTasks();
        toast(`${t.id} 已移动至「${to}」`, 'info');
      }
      dragId = null;
    });
  });
}

/* ---------------- 事件总线 ---------------- */
document.addEventListener('click', e=>{
  const nav = e.target.closest('.nav-item');
  if(nav){ go(nav.dataset.view); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;

  switch(act){
    case 'go': go(el.dataset.view); break;
    case 'close-modal': closeModal(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'report': toast('运行日报已生成，正在下载'); break;
    case 'fullscreen': toast('已进入全屏态势模式（原型演示）','info'); break;
    case 'device-detail': openDrawer(id); break;
    case 'device-control': openDrawer(id); toast('已打开远程控制面板','info'); break;
    case 'device-refresh': renderDevices(); toast('设备状态已刷新'); break;
    case 'device-export': toast('设备台账已导出'); break;
    case 'batch': toast('已进入批量指令下发模式','info'); break;

    case 'device-stat': {
      S.device.status = el.dataset.k;
      renderDevices();
      if(el.dataset.k==='在线') toast('已筛选在线设备（执行任务 + 在线待命）','info');
      break;
    }
    case 'device-new':
      openModal('添加设备','录入新设备并绑定所属园区', deviceForm(), fd=>{
        if(!fd.get('id')){ toast('请填写设备编号','error'); return false; }
        S.devices.unshift({ id:fd.get('id'), model:fd.get('model'), park:fd.get('park'), zone:fd.get('zone'), status:fd.get('status'), battery:100, signal:4, task:'—', beat:'09:15:44', temp:32.0, runtime:'0h 00m', odo:'0.0', pos:'待定位' });
        renderDevices(); toast(`设备 ${fd.get('id')} 已添加`);
      }); break;

    case 'park-new':
      openModal('新增园区','创建园区档案并初始化巡检范围', parkForm(), fd=>{
        if(!fd.get('name') || !fd.get('area')){ toast('请填写园区名称与面积','error'); return false; }
        const np = { id:fd.get('id'), name:fd.get('name'), desc:fd.get('desc'), area:fd.get('area'), zones:0, devices:0, tasks:0, done:0, owner:fd.get('owner')||'待分配', status:fd.get('status'), color:'#0284c7' };
        applyParkMap(np, fd); S.parks.push(np);
        S.park.status='全部'; S.park.q=''; renderParks();
        toast(`园区「${np.name}」已创建，地图基线：${np.mapStatus}${np.mapStatus==='已标定'||np.mapStatus==='部分标定'?'':' · 暂不可编排路线'}`, np.mapStatus==='已标定'?'success':'info');
      }); break;
    case 'park-edit': {
      const p = S.parks.find(x=>x.id===id); if(!p) break;
      openModal('编辑园区',`${p.id} · ${p.name}`, parkForm(p), fd=>{
        p.name=fd.get('name'); p.area=fd.get('area'); p.owner=fd.get('owner'); p.status=fd.get('status'); p.desc=fd.get('desc');
        applyParkMap(p, fd);
        renderParks(); toast(`园区信息已更新，地图基线：${p.mapStatus}`);
      }); break;
    }
    case 'park-map': {
      const mid = el.dataset.id;
      if(mid && S.maps.some(m=>m.id===mid)) openMapBaseline(mid);
      else { openMapPolicy(); toast('该园区尚无已发布的地图基线，请完成建图标定','info'); }
      break;
    }
    case 'map-policy': openMapPolicy(); break;
    case 'map-lineage': openMapLineage(); break;
    case 'map-impact': openMapImpact(el.dataset.id); break;
    case 'park-zones': {
      const p = S.parks.find(x=>x.id===id); if(!p) break;
      const rows = $$('#zoneCard tbody tr');
      rows.forEach(r=>r.hidden = !r.textContent.includes(p.name));
      $('#zoneFoot').textContent = `已筛选「${p.name}」的 ${S.zones.filter(z=>z.park===p.name).length} 个巡检区域`;
      $('#zoneCard').scrollIntoView({behavior:'smooth',block:'center'});
      toast(`已定位 ${p.name} 的区域清单`,'info'); break;
    }
    case 'park-view': S.parkView=el.dataset.v; renderParks(); break;
    case 'zone-new':
      openModal('新增巡检区域','为园区划分新的巡检单元', zoneForm(), fd=>{
        if(!fd.get('name')){ toast('请填写区域名称','error'); return false; }
        S.zones.push({ park:fd.get('park'), name:fd.get('name'), type:fd.get('type'), devices:0, freq:fd.get('freq'), status:'正常' });
        renderParks(); toast('巡检区域已创建');
      }); break;
    case 'zone-plan': go('routes'); toast(`已打开「${el.dataset.name}」的巡检路线编排`,'info'); break;
    case 'zone-edit': toast(`「${el.dataset.name}」进入编辑模式`,'info'); break;

    /* ---- 巡检路线规划 ---- */
    case 'rt-select': {
      if(el.dataset.id===routeState.id) break;
      stopSim(); routeState.id=el.dataset.id; routeState.selType='point'; routeState.selIdx=0;
      routeState.tab='point'; routeState.hist=[];
      renderRoutes(); toast(`已切换至「${curRoute().name}」`,'info'); break;
    }
    case 'rt-mode': routeState.mode=el.dataset.v; renderRoutes(); break;
    case 'rt-snap': routeState.snap=!routeState.snap; renderRoutes();
      toast(routeState.snap?'已开启道路吸附':'已关闭道路吸附','info'); break;
    case 'rt-undo': undoRoute(); break;
    case 'rt-optimize': optimizeRoute(); break;
    case 'rt-del': deleteWaypoint(); break;
    case 'rt-sim': simulateRoute(); break;
    case 'rt-validate': validateRoute(); break;
    case 'rt-publish': publishRoute(); break;
    case 'rt-baseline': { const mm=routeMap(curRoute()); if(mm) openMapBaseline(mm.id); else { openMapPolicy(); toast('当前路线未绑定地图基线','error'); } break; }
    case 'rt-step': selectPoint(Number(el.dataset.i)); break;
    case 'rt-tab': {
      routeState.tab=el.dataset.v;
      if(el.dataset.v==='leg' && routeState.selType!=='leg'){ routeState.selType='leg'; routeState.selIdx=0; }
      if(el.dataset.v==='point' && routeState.selType!=='point'){ routeState.selType='point'; routeState.selIdx=0; }
      renderRoutes(); break;
    }
    case 'rt-new':
      openModal('新建巡检路线','创建路线模板后在画布上编排航点', newRouteForm(), fd=>{
        if(!fd.get('name')){ toast('请填写路线名称','error'); return false; }
        const m = S.maps.find(x=>x.id===fd.get('mapId'));
        if(!m || m.status==='已归档' || m.park!==fd.get('park')){
          toast(`「${fd.get('park')}」尚无已发布地图基线，请先在园区管理完成建图标定`,'error'); return false;
        }
        const id='RT-'+String(S.routes.length+1).padStart(3,'0');
        const loop=fd.get('loop');
        S.routes.unshift({ id, name:fd.get('name'), park:fd.get('park'), zone:fd.get('zone'), status:fd.get('status'), map:m.id,
          version:'v0.1', model:fd.get('model'), loop, speed:Number(fd.get('speed'))||1.2, updated:'11-09 09:47',
          desc:fd.get('desc')||'待补充路线说明', points:[], legs:[],
          returnLeg:loop==='闭环'?{mode:'沿道路',speed:1.5,avoid:'标准',actions:[]}:null });
        stopSim(); routeState.id=id; routeState.mode='add'; routeState.selType='none'; routeState.selIdx=0;
        routeState.tab='point'; routeState.hist=[]; routeState.q='';
        renderRoutes(); toast(`路线 ${id} 已创建并冻结基线 ${m.id}，请点击画布添加航点`);
        if(m.status==='部分标定') toast('该地图仅部分楼层完成标定，未覆盖区域禁止编排航点','info');
      }); break;
    case 'rt-base': {
      const r=curRoute();
      openModal('编辑路线基础信息',`${r.id} · ${r.name}`, newRouteForm(), fd=>{
        r.name=fd.get('name')||r.name; r.park=fd.get('park'); r.zone=fd.get('zone');
        r.model=fd.get('model'); r.loop=fd.get('loop'); r.speed=Number(fd.get('speed'))||1.2;
        r.status=fd.get('status'); r.desc=fd.get('desc')||r.desc;
        if(r.loop==='闭环'&&!r.returnLeg) r.returnLeg={mode:'沿道路',speed:r.speed,avoid:'标准',actions:[]};
        if(r.loop!=='闭环') r.returnLeg=null;
        renderRoutes(); toast('路线基础信息已更新');
      });
      const body=$('#modalBody'), set=(n,v)=>{ const x=body.querySelector(`[name="${n}"]`); if(x) x.value=v; };
      set('name',r.name); set('park',r.park); set('zone',r.zone); set('model',r.model);
      set('loop',r.loop); set('speed',r.speed); set('status',r.status); set('desc',r.desc);
      break;
    }
    case 'rt-act-add': {
      const kind=el.dataset.kind, r=curRoute();
      let target=null;
      if(kind==='point'){
        if(routeState.selType!=='point' || !r.points[routeState.selIdx]){ toast('请先点选一个航点','error'); break; }
        target=r.points[routeState.selIdx].actions;
      }else{
        if(routeState.selType!=='leg'){ toast('请先点选一段航段','error'); break; }
        const l=legAt(routeState.selIdx); if(l) target=l.actions;
      }
      if(!target){ toast('请先选择配置对象','error'); break; }
      openModal(`添加${kind==='point'?'航点动作':'行进任务'}`,'配置动作类型、参数、触发条件与异常处理', addActionForm(kind), fd=>{
        const type=fd.get('type'), lib=ACTION_LIB[type]||{param:'—'};
        saveHist();
        if(kind==='point') target.push({ type, param:fd.get('param')||lib.param, trigger:fd.get('trigger')||'到达即执行', threshold:fd.get('threshold')||'—', retry:Number(fd.get('retry')||1) });
        else target.push({ type, param:fd.get('param')||lib.param });
        renderRoutes(); toast(`已添加动作：${type}`);
      }); break;
    }
    case 'rt-act-del': {
      const kind=el.dataset.kind, ai=Number(el.dataset.ai);
      const target = kind==='point'
        ? (curRoute().points[routeState.selIdx]||{}).actions
        : (legAt(routeState.selIdx)||{}).actions;
      if(!target){ break; }
      saveHist(); target.splice(ai,1); renderRoutes(); toast('动作已删除'); break;
    }
    case 'rt-goto': {
      const rid=el.dataset.id;
      if(!S.routes.some(x=>x.id===rid)){ toast('该任务未关联路线','info'); break; }
      stopSim(); closeModal();
      routeState.id=rid; routeState.selType='point'; routeState.selIdx=0; routeState.tab='point';
      go('routes'); toast('已打开任务关联的巡检路线','info'); break;
    }

    case 'task-view': S.taskView=el.dataset.v; renderTasks(); break;
    case 'task-list':
      S.taskView='table'; renderTasks(); toast(`已切换列表视图（统计项：${el.dataset.k}）`,'info'); break;
    case 'task-new':
      openModal('新建巡检任务','配置任务参数并下发至机器狗', taskForm(), fd=>{
        if(!fd.get('name')){ toast('请填写任务名称','error'); return false; }
        const rv=fd.get('route')||'—';
        S.tasks.unshift({ id:'TK-1109-'+String(S.tasks.length+1).padStart(2,'0'), name:fd.get('name'), type:fd.get('type'), device:fd.get('device'), park:fd.get('park'), zone:fd.get('zone'), time:fd.get('time'), status:'待执行', progress:0, mode:fd.get('mode'), level:fd.get('level'),
          route:rv.startsWith('RT-')?rv.slice(0,6):'—', policy:fd.get('policy') });
        S.taskView='board'; renderTasks(); toast('任务已创建并加入待执行队列');
      }); break;
    case 'task-start': {
      const t=S.tasks.find(x=>x.id===id); if(t){ t.status='执行中'; t.progress=5; renderTasks(); toast(`${t.name} 已下发执行`); } break;
    }
    case 'task-pause': {
      const t=S.tasks.find(x=>x.id===id); if(t){ t.status='待执行'; renderTasks(); toast(`${t.name} 已暂停`,'info'); } break;
    }
    case 'task-detail': {
      const t=S.tasks.find(x=>x.id===id); if(!t) break;
      const rr=S.routes.find(x=>x.id===t.route);
      const seq = rr ? rr.points.map((p,i)=>{
        const acts=p.actions.map(a=>esc(a.type)).join(' / ')||'无动作';
        const seg=i<rr.legs.length?(rr.legs[i].actions.map(a=>esc(a.type)).join(' / ')||'静默通行'):'';
        return `<div><b>P${i+1} ${esc(p.name)}</b> · ${acts}${seg?` <span style="color:#0284c7">→ 行进：${seg}</span>`:''}</div>`;
      }).join('') : '<div>该任务使用临时路径，未绑定路线模板</div>';
      openModal('任务详情',`${t.id} · ${t.name}`,
        `<div class="kv"><span>任务名称</span><b>${esc(t.name)}</b></div><div class="kv"><span>任务类型 / 模式</span><b>${esc(t.type)} / ${esc(t.mode)}</b></div>
         <div class="kv"><span>执行设备</span><b class="mono">${t.device}</b></div><div class="kv"><span>园区 / 区域</span><b>${esc(t.park)} / ${esc(t.zone)}</b></div>
         <div class="kv"><span>计划时间</span><b class="mono">${esc(t.time)}</b></div><div class="kv"><span>关联路线</span><b>${esc(routeLabel(t.route))}</b></div>
         <div class="kv"><span>下发策略</span><b>${esc(t.policy||'按路线顺序执行')}</b></div>
         <div class="kv"><span>执行状态</span><b>${badge(t.status)}</b></div>
         <div class="kv"><span>完成进度</span><b>${t.progress}%</b></div><div class="bar" style="margin-top:12px"><i style="width:${t.progress}%"></i></div>
         <div class="rt-sec-title"><span>下发后的航点执行序列</span>${ic('route')}</div>
         <div class="act-kv" style="font-size:11px;gap:6px">${seq}</div>
         <div style="margin-top:14px">${rr?`<button class="btn sm" data-act="rt-goto" data-id="${rr.id}">${ic('route')}打开路线编排</button>`:''}</div>`,
        ()=>{});
      $('#modalSubmit').hidden = true;
      break;
    }
    case 'alert-filter': S.alertFilter=el.dataset.k; renderAlerts(); break;
    case 'alert-handle': {
      const a=S.alerts.find(x=>x.id===id); if(a){ a.status='已处理'; renderAlerts(); toast(`${a.id} 已标记为处理完成`); } break;
    }
    case 'alert-all': S.alerts.forEach(a=>a.status='已处理'); renderAlerts(); toast('全部告警已处理'); break;
    case 'alert-detail': {
      const a=S.alerts.find(x=>x.id===id); if(!a) break;
      openModal('告警详情',a.id,`<div class="kv"><span>告警级别</span><b>${badge(a.level)}</b></div><div class="kv"><span>告警内容</span><b>${esc(a.text)}</b></div><div class="kv"><span>关联设备</span><b class="mono">${a.device}</b></div><div class="kv"><span>所属园区</span><b>${esc(a.park)}</b></div><div class="kv"><span>发生时间</span><b class="mono">${a.time}</b></div><div class="kv"><span>处理状态</span><b>${badge(a.status)}</b></div>`,()=>{});
      $('#modalSubmit').hidden = true; break;
    }
    case 'settings-save': toast('平台配置已保存'); break;
    case 'switch': el.classList.toggle('on'); toast(el.classList.contains('on')?'已开启该策略':'已关闭该策略','info'); break;
    case 'device-cmd': toast(`已向 ${id} 下发指令：${el.dataset.cmd}`); break;
  }
});

/* 模态提交 */
$('#modalSubmit').addEventListener('click', ()=>{
  if(!modalSubmitFn) return;
  const fd = new FormData($('#modalBody').querySelector('form') || document.createElement('form'));
  // 表单字段未包裹 form 时，手动收集
  if(!$('#modalBody').querySelector('form')){
    $$('#modalBody [name]').forEach(i=>fd.set(i.name, i.value));
  }
  const result = modalSubmitFn(fd);
  if(result !== false){ closeModal(); }
});
$('#modalOverlay').addEventListener('click', e=>{ if(e.target===$('#modalOverlay')) closeModal(); });

/* 输入类事件 */
document.addEventListener('input', e=>{
  const t=e.target, role=t.dataset.role;
  if(role==='device-search'){ S.device.q=t.value; renderDeviceTableOnly(); }
  if(role==='park-search'){ S.park.q=t.value; renderParks(); }
  if(role==='rt-search'){
    routeState.q=t.value;
    const q=t.value.trim().toLowerCase();
    $$('#v-routes .rt-item').forEach(item=>{
      const r=S.routes.find(x=>x.id===item.dataset.id);
      if(r) item.hidden = !!q && !(r.name+r.id+r.park+r.zone).toLowerCase().includes(q);
    });
  }
});
document.addEventListener('change', e=>{
  const t=e.target, role=t.dataset.role;
  if(role==='device-park'){ S.device.park=t.value; renderDeviceTableOnly(); }
  if(role==='device-status'){ S.device.status=t.value; renderDeviceTableOnly(); }
  if(role==='park-status'){ S.park.status=t.value; renderParks(); }
  if(role==='route-park'){ syncRouteMapOptions(t.value); }
  if(t.id==='actTypeSel'){
    const lib=ACTION_LIB[t.value];
    if(lib){
      const p=$('#modalBody [name="param"]'), tr=$('#modalBody [name="trigger"]'), th=$('#modalBody [name="threshold"]');
      if(p) p.value=lib.param; if(tr&&lib.trigger) tr.value=lib.trigger; if(th&&lib.threshold) th.value=lib.threshold;
    }
  }
  if(t.dataset.rf){
    if(routeState.sim) stopSim();
    const r=curRoute(), key=t.dataset.rf;
    const val = t.type==='checkbox' ? t.checked : (t.type==='number' ? Number(t.value) : t.value);
    if(routeState.selType==='point' && r.points[routeState.selIdx]) r.points[routeState.selIdx][key]=val;
    else if(routeState.selType==='leg'){ const l=legAt(routeState.selIdx); if(l) l[key]=val; }
    renderRoutes();
  }
});
function renderDeviceTableOnly(){
  // 局部刷新表格，避免输入焦点丢失
  const list = filteredDevices();
  const rows = list.map(d=>`<tr data-act="device-detail" data-id="${d.id}" style="cursor:pointer">
    <td><div class="row-flex"><span class="row-icon">${ic('dog')}</span><div><div class="cell-main mono">${d.id}</div><div class="cell-sub">${d.model}</div></div></div></td>
    <td>${esc(d.park)}<div class="cell-sub">${esc(d.zone)}</div></td><td>${badge(d.status)}</td>
    <td style="min-width:130px">${bar(d.battery)}</td><td><div class="cell-main" style="font-weight:500">${esc(d.task)}</div></td>
    <td>${ic('wifi')}<span class="mono" style="margin-left:5px">${d.signal>0?'强':'—'}</span></td><td class="mono muted">${d.beat}</td>
    <td><div class="actions"><button class="btn sm" data-act="device-control" data-id="${d.id}">${ic('play')}控制</button><button class="btn sm ghost icon" data-act="device-detail" data-id="${d.id}">${ic('eye')}</button></div></td></tr>`).join('');
  const tb = $('#v-devices .table tbody'); if(tb) tb.innerHTML = rows || emptyRow('没有符合条件的设备');
  const foot = $('#v-devices .tfoot span'); if(foot) foot.textContent = `显示 ${list.length} 条记录`;
  $$('#v-devices .stat-tab[data-act="device-stat"]').forEach(t=>t.classList.toggle('on', t.dataset.k===S.device.status));
  const sel = $('[data-role="device-status"]');
  if(sel && Array.from(sel.options).some(o=>o.value===S.device.status)) sel.value = S.device.status;
}

/* 顶栏交互 */
$('#btnToggle').addEventListener('click', ()=>$('#sidebar').classList.toggle('collapsed'));
$('#globalSearch').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const q=e.target.value.trim(); if(!q) return;
  S.device.q=q; S.view='devices'; go('devices');
  toast(`已在设备管理中搜索「${q}」`,'info');
});
$('#btnBell').addEventListener('click', e=>{
  e.stopPropagation();
  const pop=$('#bellPop');
  if(!pop.hidden){ pop.hidden=true; return; }
  pop.innerHTML = `<div class="popover-head"><span>告警通知</span><span class="tag orange">${S.alerts.filter(a=>a.status==='未处理').length} 条未处理</span></div>
    ${S.alerts.slice(0,4).map(a=>`<div class="alert-item" style="padding:11px 15px;border-bottom:1px solid var(--line-2)"><div class="alert-ico ${a.status==='未处理'?'danger':'info'}">${ic('bell')}</div><div class="alert-txt"><b>${esc(a.text)}</b><span>${esc(a.park)} · ${a.time}</span></div></div>`).join('')}
    <div class="popover-foot"><button class="btn sm ghost" data-act="go" data-view="alerts">查看全部告警 ${ic('chevron-right')}</button></div>`;
  pop.hidden=false;
});
document.addEventListener('click', e=>{ if(!e.target.closest('#bellPop') && !e.target.closest('#btnBell')) $('#bellPop').hidden=true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeDrawer(); $('#bellPop').hidden=true; } });

/* 时钟 */
function tick(){
  const d=new Date();
  const wd=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  const p=n=>String(n).padStart(2,'0');
  $('#clock').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${wd} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  $('#syncTime').textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
tick(); setInterval(tick,1000);

/* 启动：支持通过 ?view=parks / routes / devices / tasks / alerts / settings 直达指定模块 */
renderDashboard(); renderParks(); renderRoutes(); renderDevices(); renderTasks(); renderAlerts(); renderSettings();
const initView = new URLSearchParams(location.search).get('view');
if(initView && VIEW_META[initView]) go(initView);
</script>
</body>
</html>
