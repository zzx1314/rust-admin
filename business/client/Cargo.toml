[package]
name = "robodog-device-client"
version = "0.1.0"
edition = "2024"
description = "Robot-dog device client simulator — WebSocket gateway client"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
pico-args = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
# 本体链路是明文 ws://，TLS 仅为了 wss:// 兼容；用 rustls 避免 cross 编译时的 openssl
# 依赖（部署目标 192.168.41.246 是 aarch64，从 x86\_64 交叉编译）。
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 本体文件服务（robot_http_server）没有 zip 端点，需要在本机打包后回传
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
