[package]
name = "robodog-ops-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
# 反向控制信道：业务平台主动拨入中台（内网部署无入站端口）
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
jsonwebtoken = "9"
# 配置文件 server.toml（环境变量仍优先）
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
# 录像回传按内容 sha256 去重（弱网重传同一段不新增行）
sha2 = "0.10"
# 录像播放：按 Range 流式回字节，不把整个 mp4 读进内存
tokio-util = { version = "0.7", features = ["io"] }
# HTTPS 监听（`tls.rs`）：自签证书即可 —— 浏览器只在安全上下文里开放 AudioWorklet
# 与麦克风（网页对讲），而目标机 443 已被厂商 OTA 的 nginx 占用，所以另起一个端口。
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# `tower::service_fn` + `hyper::Request<Incoming>`：给 TLS 连接注入 ConnectInfo
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["server", "http1"] }
# 只用 ring 提供密码学实现：默认的 aws-lc-rs 要现编 C 代码，离线/交叉编译都会卡
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
# 企业微信图片消息要「原图字节的 md5」（base64 之前）
md-5 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
png = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }

[dev-dependencies]
# 集成测试：直接驱动 axum Router，无需起监听端口
tower = { version = "0.5", features = ["util"] }
