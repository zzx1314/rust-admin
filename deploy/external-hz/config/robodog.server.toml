# 业务平台正式环境配置：/opt/hz/rust-admin/robodog/server.toml
#
# 密钥由 systemd 的 EnvironmentFile=/opt/hz/rust-admin/robodog.env 注入：
#   ROBODOG_JWT_SECRET     控制台登录令牌签名密钥
#   ROBODOG_SERVICE_TOKEN  与中台互通内部接口的共享令牌（= 中台 APP_DOG__BUSINESS_API_TOKEN）
#
# 相对路径按本文件所在目录（/opt/hz/rust-admin/robodog）解析。

port = 3100
database = "data/robodog.db"
web_dist = "web"
ingest_dir = "data/map_ingest"

# 中台 SQLite：建图回传要写 dog_map，同时读取已上传的 ROS 地图
backend_db = "/opt/hz/rust-admin/zentai/data/users.db"

# 设备心跳超时（秒）：客户端 10s 一次心跳，留 9 倍窗口
device_timeout_secs = 90
# 任务执行超时（秒）：客户端跑任务时每 5s 上报一次进度
task_timeout_secs = 120

[zentai]
# 同机部署：反向控制信道与内部接口都走本机回环
# 端口必须与中台 [server] port 一致（3000 被本机 frps 占用，中台用 3005）
ws_url = "ws://127.0.0.1:3005"
base_url = "http://127.0.0.1:3005"

# ---- 数据采集背包（板端 Agent，控制台「实时视频」页）----
#
# 正式环境是「平台在公网、背包在现场内网」：业务服务连不上板端，但操作员浏览器
# 与背包同网段。所以这里配 **浏览器可达的地址**（直连模式），由后端下发给页面，
# REST/SSE 由浏览器直接调板端 Agent（板端已开 CORS），视频仍是浏览器 ⇄ mediamtx。
#
# 现场板子（.246）两个 IP：wifi 192.168.41.246、背包内网 eth0 192.168.234.200。
# 取操作员所在网段能访问的那个：
#   ROBODOG_BACKPACK_BROWSER_URL=http://192.168.41.246:8000
# webrtc 基址默认按同主机 :8889 推导，端口不同才需要
#   ROBODOG_BACKPACK_WEBRTC_URL=http://192.168.41.246:8889
#
# 若哪天把平台也部署到现场内网（业务服务能直接访问板端），改用代理模式即可：
#   [backpack]
#   base_url = "http://192.168.41.246:8000"
# 详细链路与取舍见 business/docs/backpack-video-integration.md
[backpack]
# browser_url = "http://192.168.41.246:8000"
