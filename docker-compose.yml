# 一键启动 rust-admin 前后端 + Redis
# 用法：
#   docker compose up -d --build
# 访问：
#   前端：http://localhost
#   后端 API：http://localhost:3000

services:
  redis:
    image: redis:7-alpine
    container_name: x-admin-redis
    command: redis-server --requirepass 123456
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - rust-admin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: x-admin-backend
    ports:
      - "3000:3000"
    environment:
      # 后端配置规则：APP_ 前缀 + 双下划线表示嵌套
      - APP_SERVER__HOST=0.0.0.0
      - APP_SERVER__PORT=3000
      - APP_DATABASE_URL=sqlite:data/users.db?mode=rwc
      - APP_REDIS__HOST=redis
      - APP_REDIS__PORT=6379
      - APP_REDIS__PASSWORD=123456
      - APP_JWT_SECRET=${JWT_SECRET:-your-secret-key}
      # 如需启用 Harbor 镜像仓库功能，取消下面注释并填写真实值
      # - APP_HARBOR__URL=${HARBOR_URL}
      # - APP_HARBOR__USERNAME=${HARBOR_USERNAME}
      # - APP_HARBOR__PASSWORD=${HARBOR_PASSWORD}
      # - APP_HARBOR__WEBHOOK_SECRET=${HARBOR_WEBHOOK_SECRET}
    volumes:
      # SQLite 数据持久化
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/3000'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - rust-admin

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: x-admin-frontend
    ports:
      - "3003:3003"
    volumes:
      # 用适合 compose 网络的 nginx 配置覆盖镜像默认配置
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rust-admin

volumes:
  redis-data:
  backend-data:

networks:
  rust-admin:
    driver: bridge
