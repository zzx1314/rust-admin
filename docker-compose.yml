services:
  redis:
    image: redis:7-alpine
    container_name: rust-admin-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - rust-admin-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY:-}rust-admin-backend:${TAG:-latest}
    container_name: rust-admin-backend
    depends_on:
      - redis
    environment:
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: 3000
      APP_DATABASE_URL: sqlite:data/users.db?mode=rwc
      APP_REDIS__HOST: redis
      APP_REDIS__PORT: 6379
      APP_REDIS__PASSWORD: ${REDIS_PASSWORD:-123456}
      APP_JWT_SECRET: ${JWT_SECRET:-change-this-secret}
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - rust-admin-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-}rust-admin-frontend:${TAG:-latest}
    container_name: rust-admin-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    restart: unless-stopped
    networks:
      - rust-admin-net

networks:
  # 显式指定子网，避免 Docker 自动分配与局域网(如 192.168.1.x)冲突的网段
  rust-admin-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_NETWORK_SUBNET:-10.10.0.0/16}

volumes:
  backend-data:
  redis-data:
