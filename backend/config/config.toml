# Local development configuration.
#
# This file is checked in and MUST NOT contain secrets. `jwt_secret` and the
# Redis password are injected through environment variables (see
# `config/config.toml.example` and `src/config/mod.rs`).
#
# The server refuses to start without APP_JWT_SECRET. Quick local setup:
#
#   export APP_JWT_SECRET="$(openssl rand -hex 32)"

database_url = "sqlite:data/users.db?mode=rwc"

# 会话令牌存储：redis（默认，需要 redis-server）/ memory（进程内存，不用 Redis）。
# 本机没装 Redis 时用 `APP_TOKEN_STORE=memory ./run.sh` 启动即可。
# token_store = "memory"

[server]
host = "0.0.0.0"
port = 3000
# 前端构建产物目录（`cd frontend && pnpm build` 产出的 dist）。
# 配好后访问 http://<host>:3000 就能直接打开前端页面，`/api` 仍由本服务提供，
# 生产环境因此不再需要 nginx。本地开发习惯用 `pnpm dev`，默认不配。
# static_dir = "../frontend/dist"

[redis]
host = "localhost"
port = 6379
# token_store = "memory" 时可以整段删掉。

[dog]
# 地图包上传目录（<upload_dir>/maps）
upload_dir = "data/device_uploads"
# 业务平台地址：中台设备页「同步地图」按钮通过它向设备下发指令。
# 服务令牌不写入本文件，用环境变量 APP_DOG__BUSINESS_API_TOKEN 注入。
business_api_url = "http://127.0.0.1:3100"
