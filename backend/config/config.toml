# Local development configuration.
#
# This file is checked in and MUST NOT contain secrets. `jwt_secret` and the
# Redis password are injected through environment variables (see
# `config/config.toml.example` and `src/config/mod.rs`).
#
# The server refuses to start without APP_JWT_SECRET. Quick local setup:
#
#   export APP_JWT_SECRET="$(openssl rand -hex 32)"

database_url = "sqlite:data/users.db?mode=rwc"

[server]
host = "0.0.0.0"
port = 3000

[redis]
host = "localhost"
port = 6379

[dog]
# 地图包上传目录（<upload_dir>/maps）
upload_dir = "data/device_uploads"
