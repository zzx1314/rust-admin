[package]
name = "x-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
base64 = "0.22"
bcrypt = "0.16"
cbc = "0.1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
futures-util = "0.3"
hmac = "0.12"
http-body-util = "0.1"
jsonwebtoken = "9"
md-5 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "uuid", "macros"] }
# `*-rustls` 与 `reqwest` 的 rustls 组合：整个服务不依赖 OpenSSL，
# 这样就能编出 x86_64-unknown-linux-musl 静态二进制，部署到 glibc 2.17
# 的老系统（CentOS 7）时不用担心目标机 glibc / libssl 版本。
sea-orm = { version = "1.1", features = ["runtime-tokio-rustls", "macros", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "charset", "http2"] }
socket2 = "0.6"
async-trait = "0.1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
# `fs` + `compression-gzip`：把前端构建产物直接由本服务托管（见 src/api/static_site.rs）。
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "set-header", "trace"] }
tracing = "0.1"
urlencoding = "2.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# 地图包（.zip 内含 model.pgm + model.yaml）解析与转换
zip = "2"
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }

[dev-dependencies]
axum-test = "18"
# 测试里扮演「拨入中台的业务平台」，验证反向控制信道
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

